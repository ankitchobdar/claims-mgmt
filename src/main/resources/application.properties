spring.application.name=claims-mgmt

# Spring datasource for AWS RDS MySQL - replace placeholders
aws.database.secret.name=dev-claims-mysql

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Connection pool (Hikari) tuning examples
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

server.port=8080

database.schema=management
aws.region=ap-southeast-2

# AWS credentials removed from repository for security.
# Use IAM roles (EC2 instance profile, ECS task role, Lambda role, or EKS IRSA) in production.
# For local development, set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY environment variables
# or use an AWS profile: export AWS_PROFILE=my-dev-profile
# For CI, configure OIDC-based assume-role (recommended) or use encrypted secrets as a fallback.